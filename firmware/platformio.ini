; PlatformIO project for haptic-band-esp32c3.ino
;
; Added so this firmware can be built and flashed with the same reliable
; PlatformIO toolchain already set up and proven working on this Mac —
; no separate Arduino IDE installation needed.
;
[platformio]
default_envs = xiao_esp32c3
src_dir = haptic-band-esp32c3

[env:xiao_esp32c3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32c3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -Wall

lib_deps =
    bblanchon/ArduinoJson@^7.2.0

board_build.partitions = default.csv
board_build.flash_mode = dio
